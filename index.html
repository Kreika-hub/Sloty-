<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sloty" />
  <meta name="description" content="Sloty - Gestión inteligente de estacionamientos" />
  <link rel="apple-touch-icon" href="/icons/icon-512.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Sloty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="app">
    <div id="welcome-screen" class="screen"></div>
    <div id="login-screen" class="screen hidden"></div>
    <div id="register-screen" class="screen hidden"></div>
    <div id="guard-pin-screen" class="screen hidden"></div>
    <div id="main-screen" class="screen hidden"></div>
  </div>
  <!-- QR GENERATION & SCANNING LIBRARIES -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
